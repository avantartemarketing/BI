services:
  - type: web
    name: avantarte-launch-bi
    runtime: node
    plan: starter
    # pandas powers the on-box ETL rerun for the live sheet refresh; if the
    # install fails the app still serves the committed snapshots
    buildCommand: npm ci && npm run build && ((python3 -m venv .venv && .venv/bin/pip install --quiet pandas) || echo "pandas install failed - live refresh disabled")
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Render ignores this file for a service created in the dashboard - set
      # these by hand under Environment. Without SESSION_SECRET every deploy
      # signs everyone out; without the disk paths below, users, passwords,
      # target edits and the decision log reset on every deploy.
      - key: SESSION_SECRET
        generateValue: true
      - key: USERS_PATH          # e.g. /var/data/users.json on a persistent disk mounted at /var/data
        sync: false
      - key: SAVED_INPUTS_PATH   # e.g. /var/data/inputs.saved.json
        sync: false
      - key: TARGETS_LOG         # e.g. /var/data/targets.log.jsonl
        sync: false
      - key: DECISIONS_PATH      # e.g. /var/data/decisions.log.jsonl
        sync: false
      - key: BIGQUERY_SERVICE_ACCOUNT_JSON   # BigQuery reader key JSON - the preferred feed (Data Viewer on the dataset + Job User on the project)
        sync: false
      - key: BQ_SINCE   # how far back to pull; also sets the BigQuery bill (default 2025-01-01)
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON   # sheet reader key JSON (share the sheet with its client_email); the fallback feed, capped at 50k rows/tab
        sync: false
      - key: HUBSPOT_TOKEN   # HubSpot Private App token (Marketing Email read scope) - live email delivered/open/click stats
        sync: false
      - key: NOTION_TOKEN   # Notion internal-integration secret (share the artist-posts database with it) - live artist posts
        sync: false
      - key: RESEND_API_KEY   # only for the dormant magic-link flow
        sync: false
      - key: MAIL_FROM        # only for the dormant magic-link flow
        sync: false
